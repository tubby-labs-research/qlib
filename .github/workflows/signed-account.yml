name: Signed account offline checks
on:
  pull_request:
    branches: [tubby-v0.9.7]
permissions:
  contents: read
jobs:
  signed-account:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and install derivative
        run: python -m pip install .
      - name: Test installed derivative outside its source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import qlib; assert qlib.__version__ == '0.9.7+tubby.3'; print(qlib.__file__)"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_signed_*.py'
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_executor_day_cache.py'
